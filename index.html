<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NanoCredi - Prototype</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f7fc;
    color:#10213d;
    max-width:390px;
    margin:0 auto;
    padding:14px;
}

/* =========================
   CADRE PRINCIPAL
========================= */

.amount-box{
    background:#ffffff;
    border-radius:22px;
    padding:22px 15px 19px;
    text-align:center;
    margin-bottom:13px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.prototype{
    color:#1764ca;
    font-size:10px;
    font-weight:bold;
    margin-bottom:8px;
    letter-spacing:.4px;
}

.person-name{
    color:#1764ca;
    font-size:19px;
    font-weight:bold;
    margin-bottom:13px;
}

.amount-label{
    display:inline-block;
    background:#e5f0ff;
    color:#1764ca;
    border-radius:22px;
    padding:7px 17px;
    font-size:14px;
    font-weight:bold;
}

.amount{
    color:#10213d;
    font-size:29px;
    font-weight:800;
    margin-top:15px;
}

/* =========================
   STATISTIQUES
========================= */

.stats{
    display:flex;
    gap:9px;
    margin-bottom:13px;
}

.stat{
    flex:1;
    background:#ffffff;
    border-radius:17px;
    padding:14px 6px;
    text-align:center;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-title{
    color:#718096;
    font-size:11px;
    font-weight:bold;
    margin-bottom:7px;
}

.stat-value{
    color:#10213d;
    font-size:15px;
    font-weight:bold;
}

/* =========================
   BOUTON RETRAIT
========================= */

.withdraw{
    width:100%;
    height:53px;
    border:0;
    border-radius:17px;
    background:#1764ca;
    color:#ffffff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:13px;
}

.withdraw:disabled{
    opacity:.6;
}

/* =========================
   CHARGEMENT
========================= */

.loading{
    display:none;
    text-align:center;
    margin:13px 0 17px;
    color:#1764ca;
    font-size:14px;
}

.spinner{
    width:38px;
    height:38px;
    margin:0 auto 9px;
    border:4px solid #dce8f7;
    border-top:4px solid #1764ca;
    border-radius:50%;
    animation:rotation 1s linear infinite;
}

@keyframes rotation{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   MESSAGE ERREUR
========================= */

.error-message{
    display:none;
    text-align:center;
    color:#e53935;
    font-size:14px;
    font-weight:bold;
    line-height:1.5;
    margin:13px 0 17px;
}

.error-message span{
    font-size:12px;
    font-weight:normal;
}

/* =========================
   MODE DE RETRAIT
========================= */

.title{
    color:#10213d;
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.networks{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:13px;
}

.network{
    min-height:42px;
    border:0;
    border-radius:13px;
    background:#ffffff;
    color:#1764ca;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.network.selected{
    background:#1764ca;
    color:#ffffff;
}

/* =========================
   FORMULAIRE
========================= */

.form-box{
    background:#ffffff;
    border-radius:17px;
    padding:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.form-title{
    color:#10213d;
    font-size:14px;
    font-weight:bold;
    margin-bottom:9px;
}

input{
    width:100%;
    height:45px;
    border:0;
    outline:0;
    border-radius:13px;
    background:#f0f5fb;
    color:#10213d;
    padding:0 14px;
    font-size:14px;
    margin-bottom:15px;
}

input::placeholder{
    color:#8a98aa;
}

.reseau-title{
    color:#10213d;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.reseau{
    color:#1764ca;
    font-size:13px;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- =========================
     CADRE PRINCIPAL
========================= -->

<div class="amount-box">

    <div class="prototype">
        PROTOTYPE
    </div>

    <div class="person-name" id="personName">
        Nom de la personne
    </div>

    <div class="amount-label">
        Solde disponible 👁
    </div>

    <div class="amount" id="amount">
        0 FCFA
    </div>

</div>


<!-- =========================
     STATISTIQUES
========================= -->

<div class="stats">

    <div class="stat">

        <div class="stat-title">
            Vues comptées
        </div>

        <div class="stat-value">
            162 vues
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Retrait
        </div>

        <div class="stat-value">
            Disponible
        </div>

    </div>

</div>


<!-- =========================
     BOUTON RETRAIT
========================= -->

<button
    class="withdraw"
    id="withdrawBtn"
    type="button">

    💸 RETIRER

</button>


<!-- =========================
     CHARGEMENT
========================= -->

<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

    <div>
        Veuillez patienter...
    </div>

</div>


<!-- =========================
     MESSAGE ERREUR
========================= -->

<div
    id="errorMessage"
    class="error-message">

    Retrait impossible

    <br>

    <span>
        Veuillez contacter votre responsable.
    </span>

</div>


<!-- =========================
     MODE DE RETRAIT
========================= -->

<div class="title">
    Choisir votre mode de retrait
</div>


<div class="networks">

    <button
        class="network"
        type="button"
        data-network="Wave">

        Wave

    </button>


    <button
        class="network"
        type="button"
        data-network="MTN">

        MTN

    </button>


    <button
        class="network"
        type="button"
        data-network="Moov">

        Moov

    </button>


    <button
        class="network"
        type="button"
        data-network="Orange">

        Orange

    </button>

</div>


<!-- =========================
     FORMULAIRE
========================= -->

<div class="form-box">

    <div class="form-title">
        Numéro de retrait
    </div>


    <input
        id="phone"
        type="tel"
        inputmode="numeric"
        placeholder="Numéro de retrait">


    <div class="reseau-title">
        Réseau :
    </div>


    <div
        class="reseau"
        id="selectedNetwork">

        Aucun réseau sélectionné

    </div>

</div>


<script>

/* =========================
   PARAMÈTRES DE L'URL
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const nom =
    params.get("nom");

const montant =
    params.get("montant");


/* =========================
   AFFICHER LE NOM
========================= */

if(nom){

    document.getElementById(
        "personName"
    ).textContent = nom;

}


/* =========================
   AFFICHER LE MONTANT
========================= */

if(montant){

    const nombre =
        Number(
            montant.replace(/\s/g,"")
        );

    if(!isNaN(nombre)){

        document.getElementById(
            "amount"
        ).textContent =
            nombre.toLocaleString("fr-FR")
            + " FCFA";

    }

}


/* =========================
   CHOIX DU RÉSEAU
========================= */

const networkButtons =
    document.querySelectorAll(
        ".network"
    );

const selectedNetwork =
    document.getElementById(
        "selectedNetwork"
    );


networkButtons.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                networkButtons.forEach(
                    function(item){

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


                button.classList.add(
                    "selected"
                );


                selectedNetwork.textContent =
                    button.dataset.network;

            }
        );

    }
);


/* =========================
   BOUTON RETRAIT
========================= */

const withdrawBtn =
    document.getElementById(
        "withdrawBtn"
    );

const loading =
    document.getElementById(
        "loading"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


withdrawBtn.addEventListener(
    "click",
    function(){

        withdrawBtn.disabled = true;

        loading.style.display =
            "block";

        errorMessage.style.display =
            "none";


        setTimeout(
            function(){

                loading.style.display =
                    "none";

                errorMessage.style.display =
                    "block";

                withdrawBtn.disabled =
                    false;

            },
            4000
        );

    }
);

</script>

</body>
</html>
