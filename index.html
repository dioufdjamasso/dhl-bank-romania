<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retrait - Démonstration</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#061a33;
    color:white;
    max-width:390px;
    margin:0 auto;
    padding:20px;
}

/* =========================
   MONTANT EN HAUT
========================= */

.amount-box{
    background:#102852;
    border-radius:25px;
    padding:24px 15px;
    text-align:center;
    margin-bottom:18px;
}

.demo{
    color:#20df8a;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.amount-label{
    color:#b9c4d5;
    font-size:17px;
    margin-bottom:6px;
}

.amount{
    font-size:31px;
    font-weight:bold;
}


/* =========================
   VUES / RETRAIT
========================= */

.stats{
    display:flex;
    gap:15px;
    margin-bottom:28px;
}

.stat{
    flex:1;
    background:#102852;
    border-radius:25px;
    padding:28px 8px;
    text-align:center;
}

.stat-title{
    color:#bfc8d7;
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}

.stat-value{
    font-size:21px;
    font-weight:bold;
}


/* =========================
   BOUTON RETIRER
========================= */

.withdraw{
    width:100%;
    height:100px;
    border:none;
    border-radius:32px;
    background:#20df8a;
    color:#061a33;
    font-size:25px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:30px;
}

.withdraw:disabled{
    cursor:not-allowed;
}


/* =========================
   CHARGEMENT
========================= */

.loading{
    display:none;
    text-align:center;
    margin:25px 0;
    font-size:18px;
}

.spinner{
    width:55px;
    height:55px;
    margin:0 auto 15px;
    border:6px solid #d5d5d5;
    border-top:6px solid #20df8a;
    border-radius:50%;
    animation:rotation 1s linear infinite;
}

@keyframes rotation{
    to{
        transform:rotate(360deg);
    }
}


/* =========================
   MESSAGE D'ERREUR
========================= */

.error-message{
    display:none;
    text-align:center;
    color:#ff3030;
    font-size:18px;
    font-weight:bold;
    line-height:1.6;
    margin-top:25px;
}

.error-message span{
    font-size:15px;
    font-weight:normal;
}


/* =========================
   MODE DE RETRAIT
========================= */

.title{
    font-size:19px;
    margin-bottom:18px;
}

.networks{
    display:flex;
    gap:10px;
    margin-bottom:30px;
}

.network{
    flex:1;
    border:none;
    border-radius:20px;
    background:#102852;
    color:#fff;
    padding:18px 4px;
    font-size:16px;
    cursor:pointer;
}


/* =========================
   FORMULAIRE
========================= */

.form-box{
    background:#102852;
    border-radius:25px;
    padding:28px 30px;
}

.form-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

input{
    width:100%;
    height:58px;
    border:none;
    outline:none;
    border-radius:18px;
    background:#1a3563;
    color:#fff;
    padding:0 20px;
    font-size:17px;
    margin-bottom:25px;
}

input::placeholder{
    color:#b8c2d2;
}

.reseau-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.reseau{
    font-size:17px;
    font-weight:bold;
}


/* =========================
   MESSAGE DEMO
========================= */

.demo-message{
    text-align:center;
    color:#ffcc00;
    font-size:13px;
    margin-top:24px;
    line-height:1.5;
}

</style>
</head>


<body>


<!-- MONTANT -->

<div class="amount-box">

    <div class="demo">
        DÉMONSTRATION
    </div>

    <div class="amount-label">
        Montant disponible
    </div>

    <div class="amount">
        0 FCFA
    </div>

</div>


<!-- VUES / RETRAIT -->

<div class="stats">

    <div class="stat">

        <div class="stat-title">
            Vues comptées
        </div>

        <div class="stat-value">
            162 vues
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Retrait
        </div>

        <div class="stat-value">
            Disponible
        </div>

    </div>

</div>


<!-- BOUTON RETIRER -->

<button class="withdraw" id="withdrawBtn">
    💸 RETIRER
</button>


<!-- CHARGEMENT -->

<div id="loading" class="loading">

    <div class="spinner"></div>

    <div>
        Veuillez patienter...
    </div>

</div>


<!-- MESSAGE D'ERREUR -->

<div id="errorMessage" class="error-message">

    Retrait impossible<br>

    <span>
        Veuillez contacter votre responsable.
    </span>

</div>


<!-- MODE DE RETRAIT -->

<div class="title">
    Choisir votre mode de retrait
</div>


<div class="networks">

    <button class="network">
        Wave
    </button>

    <button class="network">
        MTN
    </button>

    <button class="network">
        Moov
    </button>

    <button class="network">
        Orange
    </button>

</div>


<!-- FORMULAIRE -->

<div class="form-box">

    <div class="form-title">
        Veuillez saisir numéro de retrait
    </div>


    <input
        type="tel"
        placeholder="Numéro de retrait"
    >


    <div class="reseau-title">
        Réseau :
    </div>


    <div class="reseau">
        MTN
    </div>

</div>


<div class="demo-message">

    Interface de démonstration — aucun retrait réel.

</div>


<!-- JAVASCRIPT -->

<script>

const withdrawBtn = document.getElementById("withdrawBtn");

const loading = document.getElementById("loading");

const errorMessage = document.getElementById("errorMessage");


withdrawBtn.addEventListener("click", function(){

    withdrawBtn.disabled = true;

    withdrawBtn.style.opacity = "0.6";

    loading.style.display = "block";

    errorMessage.style.display = "none";


    setTimeout(function(){

        loading.style.display = "none";

        errorMessage.style.display = "block";

        withdrawBtn.disabled = false;

        withdrawBtn.style.opacity = "1";

    }, 4000);

});

</script>


</body>
  </html>
