<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NanoCredi - Espace client</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#061a33;
    color:#fff;
    max-width:390px;
    margin:0 auto;
    padding:14px;
}

/* CARTE PRINCIPALE */

.amount-box{
    background:#102852;
    border-radius:17px;
    padding:17px 14px;
    text-align:center;
    margin-bottom:12px;
}

.prototype{
    color:#20df8a;
    font-size:9px;
    font-weight:bold;
    margin-bottom:5px;
    letter-spacing:.5px;
}

.person-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:7px;
}

.amount-label{
    color:#b9c4d5;
    font-size:13px;
}

.amount{
    font-size:25px;
    font-weight:bold;
    margin-top:4px;
}

/* STATISTIQUES */

.stats{
    display:flex;
    gap:9px;
    margin-bottom:13px;
}

.stat{
    flex:1;
    background:#102852;
    border-radius:17px;
    padding:14px 6px;
    text-align:center;
}

.stat-title{
    color:#bfc8d7;
    font-size:11px;
    font-weight:bold;
    margin-bottom:7px;
}

.stat-value{
    font-size:15px;
    font-weight:bold;
}

/* BOUTON RETRAIT */

.withdraw{
    width:100%;
    height:53px;
    border:0;
    border-radius:17px;
    background:#20df8a;
    color:#061a33;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:13px;
}

.withdraw:disabled{
    opacity:.6;
}

/* CHARGEMENT */

.loading{
    display:none;
    text-align:center;
    margin:13px 0 17px;
    font-size:14px;
}

.spinner{
    width:38px;
    height:38px;
    margin:0 auto 9px;
    border:4px solid #d5d5d5;
    border-top:4px solid #20df8a;
    border-radius:50%;
    animation:rotation 1s linear infinite;
}

@keyframes rotation{
    to{
        transform:rotate(360deg);
    }
}

/* MESSAGE ERREUR */

.error-message{
    display:none;
    text-align:center;
    color:#ff3030;
    font-size:14px;
    font-weight:bold;
    line-height:1.5;
    margin:13px 0 17px;
}

.error-message span{
    font-size:12px;
    font-weight:normal;
}

/* MODE DE RETRAIT */

.title{
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.networks{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:13px;
}

.network{
    min-height:42px;
    border:0;
    border-radius:13px;
    background:#102852;
    color:#fff;
    font-size:12px;
    cursor:pointer;
}

.network.selected{
    background:#20df8a;
    color:#061a33;
    font-weight:bold;
}

/* FORMULAIRE */

.form-box{
    background:#102852;
    border-radius:17px;
    padding:17px;
}

.form-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:9px;
}

input{
    width:100%;
    height:45px;
    border:0;
    outline:0;
    border-radius:13px;
    background:#1a3563;
    color:#fff;
    padding:0 14px;
    font-size:14px;
    margin-bottom:15px;
}

input::placeholder{
    color:#b8c2d2;
}

.reseau-title{
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.reseau{
    font-size:13px;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- CARTE PRINCIPALE -->

<div class="amount-box">

    <div class="prototype">
        PROTOTYPE
    </div>

    <div class="person-name" id="personName">
        Nom de la personne
    </div>

    <div class="amount-label">
        Montant disponible
    </div>

    <div class="amount" id="amount">
        0 FCFA
    </div>

</div>


<!-- STATISTIQUES -->

<div class="stats">

    <div class="stat">

        <div class="stat-title">
            Vues comptées
        </div>

        <div class="stat-value">
            162 vues
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Retrait
        </div>

        <div class="stat-value">
            Disponible
        </div>

    </div>

</div>


<!-- BOUTON RETRAIT -->

<button
    class="withdraw"
    id="withdrawBtn"
    type="button">

    💸 RETIRER

</button>


<!-- CHARGEMENT -->

<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

    <div>
        Veuillez patienter...
    </div>

</div>


<!-- ERREUR -->

<div
    id="errorMessage"
    class="error-message">

    Retrait impossible

    <br>

    <span>
        Veuillez contacter votre responsable.
    </span>

</div>


<!-- MODE DE RETRAIT -->

<div class="title">
    Choisir votre mode de retrait
</div>


<div class="networks">

    <button
        class="network"
        type="button"
        data-network="Wave">
        Wave
    </button>

    <button
        class="network"
        type="button"
        data-network="MTN">
        MTN
    </button>

    <button
        class="network"
        type="button"
        data-network="Moov">
        Moov
    </button>

    <button
        class="network"
        type="button"
        data-network="Orange">
        Orange
    </button>

</div>


<!-- FORMULAIRE -->

<div class="form-box">

    <div class="form-title">
        Numéro de retrait
    </div>

    <input
        id="phone"
        type="tel"
        inputmode="numeric"
        placeholder="Numéro de retrait">


    <div class="reseau-title">
        Réseau :
    </div>

    <div
        class="reseau"
        id="selectedNetwork">

        Aucun réseau sélectionné

    </div>

</div>


<script>

/* =========================
   NOM ET MONTANT DE L'URL
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const nom =
    params.get("nom");

const montant =
    params.get("montant");


/* NOM */

if(nom){

    document.getElementById(
        "personName"
    ).textContent = nom;

}


/* MONTANT */

if(montant){

    const nombre =
        Number(
            montant.replace(/\s/g,"")
        );

    if(!isNaN(nombre)){

        document.getElementById(
            "amount"
        ).textContent =
            nombre.toLocaleString("fr-FR")
            + " FCFA";

    }

}


/* =========================
   CHOIX DU RÉSEAU
========================= */

const networkButtons =
    document.querySelectorAll(
        ".network"
    );

const selectedNetwork =
    document.getElementById(
        "selectedNetwork"
    );


networkButtons.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                networkButtons.forEach(
                    function(item){

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


                button.classList.add(
                    "selected"
                );


                selectedNetwork.textContent =
                    button.dataset.network;

            }
        );

    }
);


/* =========================
   BOUTON RETRAIT
========================= */

const withdrawBtn =
    document.getElementById(
        "withdrawBtn"
    );

const loading =
    document.getElementById(
        "loading"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


withdrawBtn.addEventListener(
    "click",
    function(){

        withdrawBtn.disabled = true;

        loading.style.display =
            "block";

        errorMessage.style.display =
            "none";


        setTimeout(
            function(){

                loading.style.display =
                    "none";

                errorMessage.style.display =
                    "block";

                withdrawBtn.disabled =
                    false;

            },
            4000
        );

    }
);

</script>

</body>
</html>
