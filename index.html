<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NanoCredi - Prototype</title>

<style>

/* =========================
   BASE
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#061a33;
    color:#fff;
    max-width:390px;
    margin:0 auto;
    padding:14px;
}


/* =========================
   CARTE PRINCIPALE BLANCHE
========================= */

.amount-box{
    background:#ffffff;
    border-radius:24px;
    padding:21px 13px 19px;
    text-align:center;
    margin-bottom:13px;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.prototype{
    color:#1764ca;
    font-size:10px;
    font-weight:bold;
    letter-spacing:.5px;
    margin-bottom:7px;
}

.person-name{
    color:#1764ca;
    font-size:19px;
    font-weight:bold;
    margin-bottom:14px;
}

.amount-label{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#e5f0ff;
    color:#1764ca;
    border-radius:25px;
    padding:8px 18px;
    font-size:15px;
    font-weight:bold;
}

.eye{
    font-size:16px;
}

.amount{
    color:#10213d;
    font-size:30px;
    font-weight:800;
    margin-top:15px;
    margin-bottom:23px;
}


/* =========================
   BONUS / GAIN
========================= */

.bonus-gain{
    display:flex;
    gap:9px;
    width:100%;
}

.bonus-box,
.gain-box{
    flex:1;
    height:61px;
    border:2px solid #b8d5fb;
    border-radius:31px;
    background:#e5f0ff;
    color:#1764ca;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.box-icon{
    font-size:24px;
}


/* =========================
   STATISTIQUES
========================= */

.stats{
    display:flex;
    gap:9px;
    margin-bottom:13px;
}

.stat{
    flex:1;
    background:#102852;
    border-radius:17px;
    padding:14px 6px;
    text-align:center;
    border:1px solid #193867;
}

.stat-title{
    color:#b9c7dc;
    font-size:11px;
    font-weight:bold;
    margin-bottom:7px;
}

.stat-value{
    color:#ffffff;
    font-size:15px;
    font-weight:bold;
}


/* =========================
   BOUTON RETRAIT
========================= */

.withdraw{
    width:100%;
    height:53px;
    border:0;
    border-radius:17px;
    background:#20df8a;
    color:#061a33;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:13px;
}

.withdraw:disabled{
    opacity:.6;
}


/* =========================
   CHARGEMENT
========================= */

.loading{
    display:none;
    text-align:center;
    margin:13px 0 17px;
    color:#ffffff;
    font-size:14px;
}

.spinner{
    width:38px;
    height:38px;
    margin:0 auto 9px;
    border:4px solid #365277;
    border-top:4px solid #20df8a;
    border-radius:50%;
    animation:rotation 1s linear infinite;
}

@keyframes rotation{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   MESSAGE ERREUR
========================= */

.error-message{
    display:none;
    text-align:center;
    color:#ff4b4b;
    font-size:14px;
    font-weight:bold;
    line-height:1.5;
    margin:13px 0 17px;
}

.error-message span{
    font-size:12px;
    font-weight:normal;
}


/* =========================
   MODE DE RETRAIT
========================= */

.title{
    color:#ffffff;
    font-size:15px;
    font-weight:bold;
    margin-bottom:10px;
}

.networks{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:13px;
}

.network{
    min-height:42px;
    border:1px solid #193867;
    border-radius:13px;
    background:#102852;
    color:#ffffff;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.network:hover{
    background:#173767;
}

.network.selected{
    background:#20df8a;
    color:#061a33;
    border-color:#20df8a;
}


/* =========================
   FORMULAIRE
========================= */

.form-box{
    background:#102852;
    border-radius:17px;
    padding:17px;
    border:1px solid #193867;
}

.form-title{
    color:#ffffff;
    font-size:14px;
    font-weight:bold;
    margin-bottom:9px;
}

input{
    width:100%;
    height:45px;
    border:1px solid #28466f;
    outline:0;
    border-radius:13px;
    background:#1a3563;
    color:#ffffff;
    padding:0 14px;
    font-size:14px;
    margin-bottom:15px;
}

input::placeholder{
    color:#aebbd0;
}

.reseau-title{
    color:#b9c7dc;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.reseau{
    color:#20df8a;
    font-size:13px;
    font-weight:bold;
}


/* =========================
   PETITS ÉCRANS
========================= */

@media(max-width:350px){

    body{
        padding:10px;
    }

    .amount{
        font-size:26px;
    }

    .person-name{
        font-size:17px;
    }

    .bonus-box,
    .gain-box{
        font-size:15px;
        height:57px;
    }

}

</style>
</head>


<body>


<!-- =========================
     GRANDE CARTE BLANCHE
========================= -->

<div class="amount-box">

    <div class="prototype">
        PROTOTYPE
    </div>


    <div
        class="person-name"
        id="personName">

        Nom de la personne

    </div>


    <div class="amount-label">

        <span>
            Solde disponible
        </span>

        <span class="eye">
            👁
        </span>

    </div>


    <div
        class="amount"
        id="amount">

        0 FCFA

    </div>


    <!-- BONUS ET GAIN -->

    <div class="bonus-gain">


        <button
            class="bonus-box"
            type="button">

            <span class="box-icon">
                🎁
            </span>

            <span>
                Bonus
            </span>

        </button>


        <button
            class="gain-box"
            type="button">

            <span class="box-icon">
                👛
            </span>

            <span>
                Gain
            </span>

        </button>


    </div>

</div>


<!-- =========================
     STATISTIQUES
========================= -->

<div class="stats">


    <div class="stat">

        <div class="stat-title">
            Vues comptées
        </div>

        <div class="stat-value">
            162 vues
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Retrait
        </div>

        <div class="stat-value">
            Disponible
        </div>

    </div>


</div>


<!-- =========================
     RETIRER
========================= -->

<button
    class="withdraw"
    id="withdrawBtn"
    type="button">

    💸 RETIRER

</button>


<!-- =========================
     CHARGEMENT
========================= -->

<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

    <div>
        Veuillez patienter...
    </div>

</div>


<!-- =========================
     ERREUR
========================= -->

<div
    id="errorMessage"
    class="error-message">

    Retrait impossible

    <br>

    <span>
        Veuillez contacter votre responsable.
    </span>

</div>


<!-- =========================
     MODE DE RETRAIT
========================= -->

<div class="title">

    Choisir votre mode de retrait

</div>


<div class="networks">


    <button
        class="network"
        type="button"
        data-network="Wave">

        Wave

    </button>


    <button
        class="network"
        type="button"
        data-network="MTN">

        MTN

    </button>


    <button
        class="network"
        type="button"
        data-network="Moov">

        Moov

    </button>


    <button
        class="network"
        type="button"
        data-network="Orange">

        Orange

    </button>


</div>


<!-- =========================
     FORMULAIRE
========================= -->

<div class="form-box">


    <div class="form-title">

        Numéro de retrait

    </div>


    <input
        id="phone"
        type="tel"
        inputmode="numeric"
        placeholder="Numéro de retrait">


    <div class="reseau-title">

        Réseau :

    </div>


    <div
        class="reseau"
        id="selectedNetwork">

        Aucun réseau sélectionné

    </div>


</div>


<script>

/* =========================
   PARAMÈTRES DE L'URL
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const nom =
    params.get("nom");


const montant =
    params.get("montant");


/* =========================
   NOM
========================= */

if(nom){

    document.getElementById(
        "personName"
    ).textContent = nom;

}


/* =========================
   MONTANT
========================= */

if(montant){

    const nombre =
        Number(
            montant.replace(/\s/g,"")
        );


    if(!isNaN(nombre)){

        document.getElementById(
            "amount"
        ).textContent =
            nombre.toLocaleString("fr-FR")
            + " FCFA";

    }

}


/* =========================
   CHOIX DU RÉSEAU
========================= */

const networkButtons =
    document.querySelectorAll(
        ".network"
    );


const selectedNetwork =
    document.getElementById(
        "selectedNetwork"
    );


networkButtons.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                networkButtons.forEach(
                    function(item){

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


                button.classList.add(
                    "selected"
                );


                selectedNetwork.textContent =
                    button.dataset.network;

            }
        );

    }
);


/* =========================
   BOUTON RETRAIT
========================= */

const withdrawBtn =
    document.getElementById(
        "withdrawBtn"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


withdrawBtn.addEventListener(
    "click",
    function(){

        withdrawBtn.disabled = true;


        loading.style.display =
            "block";


        errorMessage.style.display =
            "none";


        setTimeout(
            function(){

                loading.style.display =
                    "none";


                errorMessage.style.display =
                    "block";


                withdrawBtn.disabled =
                    false;

            },
            4000
        );

    }
);

</script>


</body>
    </html>
